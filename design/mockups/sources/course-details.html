<div id="course-details-v2">
  <div class="phone">
    <div class="system" aria-hidden="true"><span>10:24</span><span>▴ ▰</span></div>
    <header>
      <div class="heading"><button class="icon back" aria-label="Назад">←</button><h1>Лекции и практика<br>по C</h1><button class="icon color-toggle" aria-label="Цвет курса" aria-expanded="true"><span class="blot"></span></button></div>
      <div class="status"><span class="status-icon" aria-hidden="true">Ⅱ</span><span class="status-text">На паузе</span></div>
      <div class="palette" aria-label="Цвет курса"></div>
      <button class="category-toggle" aria-expanded="false"><span class="muted">Категория:</span> <span class="category-value">Программирование</span><span aria-hidden="true">⌄</span></button>
    </header>
    <section class="topics">
      <div class="topics-heading"><h2>Темы</h2><button class="icon edit-topics" aria-label="Редактировать темы"><i data-lucide="pencil" aria-hidden="true"></i></button><span class="count">2 из 6 тем</span></div>
      <div class="progress" role="progressbar" aria-label="Пройденные темы" aria-valuemin="0" aria-valuemax="6" aria-valuenow="2"><div></div></div>
      <div class="topic-list"></div>
    </section>
    <footer>
      <button class="schedule"><i data-lucide="calendar-days" aria-hidden="true"></i><span>Без расписания</span></button>
      <div class="action-label">Действия с курсом</div>
      <div class="actions"><button class="course-button complete">Завершить</button><button class="course-button resume">Продолжить</button><button class="course-button pause" hidden>Пауза</button><button class="course-button delete">Удалить</button></div>
    </footer>
    <div class="home-indicator" aria-hidden="true"></div>
    <div class="away" hidden><h2>Курсы</h2><button class="course-row">Лекции и практика по C</button><button class="course-button add">Добавить курс</button></div>
    <dialog><form method="dialog"><h2 class="dialog-title"></h2><div class="dialog-content"></div><div class="dialog-actions"><button value="cancel">Отмена</button><button class="course-button" value="apply">Применить</button></div></form></dialog>
  </div>
</div>
<style>
#course-details-v2{--paper:#FCFAF6;--ink:#29352E;--muted:#75766F;--line:#E5E5DF;--panel:#F0EDE5;--button-fill:#718376;--button-text:#FCFAF6;--button-radius:13px;--course:#7D9D89;font:16px/1.4 system-ui,-apple-system,sans-serif;color:var(--ink);color-scheme:light;padding:12px 0}
#course-details-v2 *{box-sizing:border-box}#course-details-v2 [hidden]{display:none!important}
#course-details-v2 .phone{position:relative;max-width:412px;height:880px;max-height:100dvh;margin:auto;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:24px}
#course-details-v2 button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}#course-details-v2 button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}#course-details-v2 button:disabled{cursor:default}
#course-details-v2 .system{display:flex;justify-content:space-between;padding:10px 20px;font-size:12px}
#course-details-v2 header{padding:10px 18px 14px;border-bottom:1px solid var(--line)}
#course-details-v2 .heading{display:flex;gap:9px;align-items:flex-start}#course-details-v2 h1{font-size:23px;line-height:1.18;font-weight:600;letter-spacing:-.55px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}#course-details-v2 .icon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 36px;min-height:40px}#course-details-v2 .back{font-size:28px;margin-left:-8px}
#course-details-v2 .blot{display:inline-flex;align-items:center;justify-content:center;width:31px;height:33px;border-radius:43% 57% 38% 62% / 62% 36% 64% 38%;transform:rotate(-15deg);background:var(--course)}#course-details-v2 .blot>span{transform:rotate(15deg);font-size:23px;color:var(--ink)}
#course-details-v2 .status{margin:10px 0 0 37px;display:flex;align-items:center;gap:8px;font-size:14px;color:#746D66}#course-details-v2 .status.completed{color:#718376}#course-details-v2 .status-icon{font-size:20px;font-weight:600;line-height:1}
#course-details-v2 .palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 12px 8px 30px}#course-details-v2 .swatch{height:44px;width:44px;display:flex;align-items:center;justify-content:center;border-radius:12px}#course-details-v2 .swatch[aria-pressed=true]{background:var(--panel)}
#course-details-v2 .category-toggle{display:flex;align-items:center;gap:5px;min-height:40px;font-size:14px;text-align:left;margin:6px 0 0 37px;max-width:calc(100% - 37px)}#course-details-v2 .category-value{overflow-wrap:anywhere}#course-details-v2 .category-toggle>span:last-child{margin-left:5px;font-size:22px}#course-details-v2 .muted{color:var(--muted)}
#course-details-v2 .topics{display:flex;flex-direction:column;flex:1;min-height:0;padding:12px 18px 0}#course-details-v2 .topics-heading{display:flex;align-items:center;gap:5px}#course-details-v2 h2{font-size:20px;font-weight:600;margin:0}#course-details-v2 .count{font-size:13px;color:var(--muted);margin-left:auto}#course-details-v2 svg{width:20px;height:20px;stroke-width:1.8}#course-details-v2 .progress{height:5px;background:color-mix(in srgb,var(--course) 20%,var(--paper));border-radius:6px;overflow:hidden;margin:10px 0 12px;flex-shrink:0}#course-details-v2 .progress>div{height:100%;background:var(--course);width:33.333%;border-radius:6px}
#course-details-v2 .topic-list{min-height:0;overflow-y:auto;flex:1;overscroll-behavior:contain;scrollbar-width:thin}#course-details-v2 .topic{display:grid;grid-template-columns:27px minmax(0,1fr) 24px;gap:10px;align-items:center;width:100%;min-height:52px;padding:13px 0;text-align:left;border-bottom:1px solid var(--line);font-size:15px;touch-action:pan-y;user-select:none}#course-details-v2 .topic .number{color:var(--muted);font-size:13px}#course-details-v2 .topic.done{color:#8A8881}#course-details-v2 .check{color:var(--course);font-size:25px}#course-details-v2 .topic-title{overflow-wrap:anywhere}
#course-details-v2 footer{padding:8px 16px 16px;border-top:1px solid var(--line)}#course-details-v2 .schedule{display:flex;gap:14px;align-items:center;width:100%;text-align:left;min-height:50px;font-size:15px;padding:4px 4px}#course-details-v2 .schedule svg{width:23px;height:23px;flex-shrink:0}#course-details-v2 .schedule span{white-space:pre-line}#course-details-v2 .action-label{font-size:12px;color:var(--muted);margin:16px 2px 9px}#course-details-v2 .actions{display:flex;gap:7px}#course-details-v2 .course-button{background:var(--button-fill);color:var(--button-text);border-radius:var(--button-radius);padding:10px 8px;min-height:40px;font-size:12px;font-weight:500}#course-details-v2 .actions>.course-button{flex:1;min-width:0}
#course-details-v2 .home-indicator{height:4px;background:#666;border-radius:4px;width:100px;margin:0 auto 9px;flex-shrink:0}#course-details-v2 .away{padding:20px;flex:1}#course-details-v2 .away h2{margin-bottom:20px}#course-details-v2 .course-row{display:block;text-align:left;width:100%;padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:20px}#course-details-v2 .add{width:100%}
#course-details-v2 dialog{color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:min(360px,90vw);max-height:85vh;overflow:auto}#course-details-v2 dialog::backdrop{background:#29352e55}#course-details-v2 .dialog-title{font-size:19px;margin-bottom:16px}#course-details-v2 .dialog-content{font-size:14px}#course-details-v2 .dialog-content label{display:block;margin:10px 0}#course-details-v2 input,#course-details-v2 textarea,#course-details-v2 select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink)}#course-details-v2 textarea{min-height:160px}#course-details-v2 .dialog-actions{display:flex;justify-content:flex-end;gap:18px;align-items:center;margin-top:20px}#course-details-v2 .category-option{display:block;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
@media(max-width:360px){#course-details-v2 header{padding-left:12px;padding-right:12px}#course-details-v2 h1{font-size:21px}#course-details-v2 .category-toggle{font-size:12px}#course-details-v2 .palette{margin-left:20px}#course-details-v2 .actions{gap:5px}}
</style>
<script>
(()=>{
 const root=document.getElementById('course-details-v2'),$=s=>root.querySelector(s),dialog=$('dialog');
 const colors=[['Зелёный','#7D9D89'],['Сиреневый','#AA99B9'],['Голубой','#6388AB'],['Охристый','#C6A65E'],['Пыльная роза','#BC858A'],['Барвинковый','#8B97B4'],['Оливковый','#9CA279'],['Какао','#AA9E90'],['Терракотовый','#BA7F69'],['Бирюзовый','#4D7270']];
 const names=['Введение в C','Переменные и типы','Условия','Циклы','Функции','Массивы'];
 const state={name:'Лекции и практика по C',color:0,expanded:true,paused:true,completed:false,deleted:false,away:false,category:'Программирование',schedule:null,topics:names.map((title,i)=>({title,done:i<2}))};
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function icons(){globalThis.lucide?.createIcons({attrs:{width:20,height:20}});}
 function render(){
  root.style.setProperty('--course',colors[state.color??0][1]);
  $('h1').textContent=state.name;$('.status').hidden=!state.paused&&!state.completed;$('.status').classList.toggle('completed',state.completed);$('.status-text').textContent=state.completed?'Завершён':'На паузе';$('.status-icon').textContent=state.completed?'✓':'Ⅱ';
  $('.color-toggle').hidden=state.completed;$('.color-toggle').setAttribute('aria-expanded',String(state.expanded));$('.palette').hidden=state.completed||(!state.expanded&&state.color!==null);
  $('.palette').innerHTML=colors.map(([name,color],i)=>`<button class="swatch" aria-label="${name}" aria-pressed="${state.color===i}" data-color="${i}"><span class="blot" style="background:${color}"><span>${state.color===i?'✓':''}</span></span></button>`).join('');
  $('.category-value').textContent=state.category||'Добавить категорию';$('.category-toggle').disabled=state.completed;$('.category-toggle>span:last-child').hidden=state.completed;
  const done=state.topics.filter(t=>t.done).length,total=state.topics.length;$('.count').textContent=`${done} из ${total} тем`;$('.progress').hidden=!total;$('.progress').setAttribute('aria-valuemax',total||1);$('.progress').setAttribute('aria-valuenow',done);$('.progress>div').style.width=(total?100*done/total:0)+'%';
  const scroll=$('.topic-list').scrollTop;$('.topic-list').innerHTML=state.topics.map((t,i)=>`<button class="topic ${t.done?'done':''}" data-topic="${i}" aria-pressed="${t.done}" aria-label="${esc(t.title)}. Удерживайте для отметки" ${state.completed?'disabled':''}><span class="number">${i+1}</span><span class="topic-title">${esc(t.title)}</span><span class="check">${t.done?'✓':''}</span></button>`).join('');$('.topic-list').scrollTop=scroll;
  $('.edit-topics').hidden=state.completed;$('.schedule').hidden=state.completed;$('.schedule span').textContent=state.schedule?`${state.schedule.days}  ${state.schedule.time}`:'Без расписания';$('.complete').hidden=state.completed;$('.resume').hidden=!state.paused||state.completed;$('.pause').hidden=state.paused||state.completed||!state.schedule;
  for(const selector of ['header','.topics','footer'])$(selector).hidden=state.away;$('.away').hidden=!state.away;$('.course-row').hidden=state.deleted;$('.course-row').textContent=state.name;icons();
 }
 let apply=null;
 function openDialog(title,content,fn,label='Применить'){ $('.dialog-title').textContent=title;$('.dialog-content').innerHTML=content;$('.dialog-actions [value=apply]').textContent=label;apply=fn;dialog.returnValue='';dialog.showModal();icons(); }
 dialog.addEventListener('close',()=>{$('.category-toggle').setAttribute('aria-expanded','false');if(dialog.returnValue==='apply'&&apply)apply();apply=null;render();});
 $('.color-toggle').onclick=()=>{state.expanded=!state.expanded;render();};$('.palette').onclick=e=>{const b=e.target.closest('[data-color]');if(!b)return;state.color=Number(b.dataset.color);state.expanded=false;render();};
 $('.category-toggle').onclick=()=>{ $('.category-toggle').setAttribute('aria-expanded','true');openDialog('Категория',`<input aria-label="Найти или добавить категорию" placeholder="Найти или добавить" value="${esc(state.category)}"><div class="category-options"></div>`,()=>{state.category=$('.dialog-content input').value.trim();});const input=$('.dialog-content input');function options(){const q=input.value.trim().toLocaleLowerCase('ru');$('.category-options').innerHTML=['Программирование','Языки','Рисование',''].filter(n=>!q||n.toLocaleLowerCase('ru').includes(q)||n==='').map(n=>`<button type="button" class="category-option" data-category="${esc(n)}">${n||'Без категории'}</button>`).join('');}input.oninput=options;$('.category-options').onclick=e=>{const b=e.target.closest('[data-category]');if(b){input.value=b.dataset.category;dialog.close('apply');}};options();input.select();};
 $('.resume').onclick=()=>{state.paused=false;render();};
 $('.pause').onclick=()=>openDialog('Приостановить курс?','Расписание будет удалено. Темы и прогресс сохранятся.',()=>{state.paused=true;state.schedule=null;},'Пауза');
 $('.complete').onclick=()=>openDialog('Завершить курс?','Все темы будут отмечены пройденными. Расписание будет удалено.',()=>{state.completed=true;state.paused=false;state.schedule=null;state.color=null;state.topics.forEach(t=>t.done=true);},'Завершить');
 $('.delete').onclick=()=>openDialog('Удалить курс?','Курс будет удалён только из этого демонстрационного макета.',()=>{state.deleted=true;state.away=true;},'Удалить');
 $('.back').onclick=()=>{state.away=true;render();};$('.course-row').onclick=()=>{state.away=false;render();};
 $('.add').onclick=()=>openDialog('Добавить курс','<label>Название<input maxlength="50" value="Новый курс"></label>',()=>{state.name=$('.dialog-content input').value.trim()||'Новый курс';Object.assign(state,{deleted:false,away:false,completed:false,paused:false,color:null,expanded:true,category:'',schedule:null,topics:[]});},'Добавить');
 $('.schedule').onclick=()=>openDialog('Расписание',`<label>Дни<select aria-label="Дни занятий"><option value="">Без расписания</option><option>Вт, Сб</option><option>Пн, Ср, Пт</option><option>Ежедневно</option></select></label><label>Время<input type="time" value="${state.schedule?.time||'19:00'}"></label>`,()=>{const days=$('.dialog-content select').value;state.schedule=days?{days,time:$('.dialog-content input').value||'19:00'}:null;state.paused=false;});
 $('.edit-topics').onclick=()=>openDialog('Редактировать темы',`<label>Непройденные темы<textarea>${esc(state.topics.filter(t=>!t.done).map(t=>t.title).join('\n'))}</textarea></label>`,()=>{const values=$('.dialog-content textarea').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),completed=new Set(state.topics.filter(t=>t.done).map(t=>t.title.toLocaleLowerCase('ru')));const pending=values.filter(t=>!completed.has(t.toLocaleLowerCase('ru')));let i=0;state.topics=state.topics.flatMap(t=>t.done?[t]:i<pending.length?[{title:pending[i++],done:false}]:[]);while(i<pending.length)state.topics.push({title:pending[i++],done:false});});
 let hold=null,start=null;const list=$('.topic-list');const cancel=()=>{clearTimeout(hold);hold=null;};list.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-topic]');if(!b||state.completed)return;start=[e.clientX,e.clientY];hold=setTimeout(()=>{const t=state.topics[Number(b.dataset.topic)];t.done=!t.done;render();},550);});list.addEventListener('pointermove',e=>{if(start&&Math.hypot(e.clientX-start[0],e.clientY-start[1])>8)cancel();});['pointerup','pointercancel','pointerleave','scroll'].forEach(type=>list.addEventListener(type,cancel));list.addEventListener('keydown',e=>{const b=e.target.closest('[data-topic]');if(b&&!state.completed&&['Enter',' '].includes(e.key)){e.preventDefault();state.topics[Number(b.dataset.topic)].done=!state.topics[Number(b.dataset.topic)].done;render();}});
 render();
})();
</script>
