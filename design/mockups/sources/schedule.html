<div id="study-schedule" aria-label="Макет настройки расписания">
 <div class="ss-phone">
  <header><div class="ss-eyebrow">МОЙ КУРС / РАСПИСАНИЕ</div><p><span class="ss-blot" aria-hidden="true"></span>Лекции и семинары по C++</p></header>
  <form class="ss-form">
   <section><div class="ss-heading"><h2>Дни занятий</h2></div><div class="ss-days" role="group" aria-label="Дни занятий"></div></section>
   <div class="ss-times"></div>
   <section class="ss-duration"><div class="ss-date-row"><h2>Дата окончания</h2><div class="ss-date-controls"><button type="button" class="ss-pick-date cursor-interaction" aria-label="Выбрать последний день занятий" aria-expanded="false"><i data-lucide="calendar-days" aria-hidden="true"></i><span class="ss-date-value" hidden></span></button><button type="button" class="ss-clear-date cursor-interaction" aria-label="Удалить конечную дату" hidden><i data-lucide="x" aria-hidden="true"></i></button></div></div><div class="ss-picker" hidden><div class="ss-picker-head"><button type="button" class="ss-prev cursor-interaction" aria-label="Предыдущий месяц">‹</button><span class="ss-month" aria-live="polite"></span><button type="button" class="ss-next cursor-interaction" aria-label="Следующий месяц">›</button></div><div class="ss-month-days" role="group" aria-label="Выбор последнего дня занятий"></div><button type="button" class="ss-picker-cancel cursor-interaction">Отмена</button></div></section>
   <p class="ss-error" role="alert" hidden></p>
   <button type="submit" class="ss-save cursor-interaction">Сохранить расписание</button>
   <div class="ss-saved" role="status" aria-live="polite"></div>
  </form>
  <div class="ss-bottom" aria-hidden="true"></div>
 </div>
</div>
<style>
#study-schedule{--ss-paper:light-dark(#fcfaf6,#222522);--ss-ink:light-dark(#29352e,#eef0e8);--ss-muted:light-dark(#697367,#aab5a8);--ss-panel:light-dark(#f1efe7,#2e342e);--ss-line:light-dark(#e5e5d9,#40483e);--ss-green:light-dark(#78ac80,#80bd91);--ss-gap:22px;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--ss-ink);padding:12px 0}
#study-schedule *{box-sizing:border-box}#study-schedule [hidden]{display:none!important}
#study-schedule .ss-phone{max-width:414px;margin:auto;background:var(--ss-paper);border:1px solid var(--ss-line);border-radius:30px;overflow:hidden}
#study-schedule header{padding:28px 24px 26px}
#study-schedule .ss-eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:500;color:var(--ss-muted)}
#study-schedule header p{font-size:12px;color:var(--ss-muted);margin:14px 0 0;display:flex;align-items:center;gap:8px;line-height:1.5}
#study-schedule .ss-blot{width:14px;height:16px;flex-shrink:0;background:var(--ss-green);border-radius:43% 57% 38% 62% / 62% 36% 64% 38%;transform:rotate(-15deg)}
#study-schedule .ss-form{padding:0 24px 12px}
#study-schedule .ss-heading{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
#study-schedule h2{font-size:17px;font-weight:500;letter-spacing:-.3px;margin:0}
#study-schedule .ss-heading>span{font-size:11px;color:var(--ss-muted)}
#study-schedule button,#study-schedule input{font:inherit;color:inherit}
#study-schedule button{border:0;background:var(--ss-panel);border-radius:12px;min-height:44px;font-size:12px;padding:10px 12px}
#study-schedule .ss-days{display:flex;gap:4px;flex-wrap:wrap}
#study-schedule .ss-day{width:44px;padding:10px 0;border-radius:14px}
#study-schedule .ss-day[aria-pressed=true]{background:var(--ss-ink);color:var(--ss-paper)}
#study-schedule .ss-times{margin-top:var(--ss-gap)}
#study-schedule .ss-time-row{padding:18px 0;border-top:1px solid var(--ss-line)}
#study-schedule .ss-time-row h3{font-size:14px;font-weight:500;margin:0 0 12px}
#study-schedule .ss-time-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
#study-schedule .ss-time-fields label,#study-schedule .ss-date-field{display:grid;gap:7px;font-size:11px;color:var(--ss-muted);min-width:0}
#study-schedule input[type=time],#study-schedule input[type=date]{width:100%;min-width:0;background:var(--ss-panel);color:var(--ss-ink);border:1px solid var(--ss-line);padding:11px 9px;border-radius:12px;font-size:16px;min-height:46px}
#study-schedule .ss-add-end{background:none;color:var(--ss-muted);border:1px dashed var(--ss-line);font-size:11px;min-height:46px}
#study-schedule .ss-end-title{display:flex;align-items:center;justify-content:space-between;gap:5px;min-height:20px}
#study-schedule .ss-remove-end{background:none;padding:0 5px;min-height:20px;font-size:11px;text-decoration:underline;text-underline-offset:3px}
@media(pointer:coarse){#study-schedule .ss-remove-end{min-height:44px}}
#study-schedule .ss-duration{padding-top:var(--ss-gap);margin-top:4px;border-top:1px solid var(--ss-line)}
#study-schedule .ss-date-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#study-schedule .ss-date-controls{display:flex;gap:5px;align-items:center}
#study-schedule .ss-pick-date{display:flex;align-items:center;gap:8px}
#study-schedule .ss-date-controls button{min-width:44px}
#study-schedule .ss-date-controls svg{width:17px;height:17px}
#study-schedule .ss-picker{margin-top:14px;background:var(--ss-panel);padding:8px;border-radius:14px}
#study-schedule .ss-picker-head{display:flex;align-items:center;justify-content:space-between;font-size:13px}
#study-schedule .ss-month-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
#study-schedule .ss-month-days>span{font-size:11px;color:var(--ss-muted);text-align:center;padding:8px 0}
#study-schedule .ss-month-days button{padding:8px 0;background:none;border-radius:10px;min-width:0}
#study-schedule .ss-month-days button[aria-pressed=true]{background:var(--ss-ink);color:var(--ss-paper)}
#study-schedule .ss-picker-cancel{display:block;margin:4px auto 0}
#study-schedule .ss-save{width:100%;background:var(--ss-ink);color:var(--ss-paper);margin-top:26px;min-height:46px}
#study-schedule .ss-error{font-size:12px;line-height:1.5;color:light-dark(#984d47,#e8aaa3);margin:15px 0 0}
#study-schedule .ss-saved{font-size:12px;line-height:1.5;color:var(--ss-muted);margin:10px 0;min-height:18px}
#study-schedule .ss-empty{font-size:13px;line-height:1.5;color:var(--ss-muted);padding:14px 0 22px}
#study-schedule .ss-bottom{height:4px;width:90px;background:var(--ss-line);border-radius:4px;margin:0 auto 12px}
</style>
<script>
(()=>{
const root=document.getElementById('study-schedule'),$=q=>root.querySelector(q);
const short=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],full=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const state={days:[1,5],times:{1:{start:'19:00',end:'',hasEnd:false},5:{start:'11:00',end:'',hasEnd:false}},hasDate:false,date:''};
const design={gap:22};
let pickerOpen=false,pickerMonth=new Date();pickerMonth=new Date(pickerMonth.getFullYear(),pickerMonth.getMonth(),1);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{days:state.days.map(d=>full[d]),schedule:state.days.map(d=>({day:full[d],start:state.times[d].start,end:state.times[d].hasEnd?state.times[d].end:null})),endDate:state.hasDate?state.date:null,design},privateContent:{schedule:state}}).catch(()=>{});}
function clearFeedback(){$('.ss-error').hidden=true;$('.ss-saved').textContent='';}
function render(){
 root.style.setProperty('--ss-gap',design.gap+'px');
 $('.ss-days').innerHTML=short.map((name,day)=>'<button type="button" class="ss-day cursor-interaction" data-day="'+day+'" aria-label="'+full[day]+'" aria-pressed="'+state.days.includes(day)+'">'+name+'</button>').join('');
 $('.ss-times').innerHTML=state.days.length?state.days.map(day=>{const t=state.times[day];return '<section class="ss-time-row"><h3>'+full[day]+'</h3><div class="ss-time-fields"><label>Начало<input type="time" data-time="start" data-index="'+day+'" value="'+esc(t.start)+'" aria-label="'+full[day]+': начало"></label>'+(t.hasEnd?'<div><div class="ss-end-title"><span style="font-size:11px;color:var(--ss-muted)">Окончание</span><button type="button" class="ss-remove-end cursor-interaction" data-remove="'+day+'" aria-label="Убрать окончание: '+full[day]+'">Убрать</button></div><input style="margin-top:7px" type="time" data-time="end" data-index="'+day+'" value="'+esc(t.end)+'" aria-label="'+full[day]+': окончание"></div>':'<button type="button" class="ss-add-end cursor-interaction" data-add="'+day+'">+ Окончание</button>')+'</div></section>';}).join(''):'<div class="ss-empty">Выберите дни занятий</div>';
 $('.ss-date-value').hidden=!state.hasDate;$('.ss-date-value').textContent=state.hasDate?state.date.split('-').reverse().join('.'):'';$('.ss-clear-date').hidden=!state.hasDate;
 $('.ss-picker').hidden=!pickerOpen;$('.ss-pick-date').setAttribute('aria-expanded',String(pickerOpen));
 if(pickerOpen){
 const year=pickerMonth.getFullYear(),month=pickerMonth.getMonth(),offset=(pickerMonth.getDay()+6)%7,total=new Date(year,month+1,0).getDate();
 $('.ss-month').textContent=pickerMonth.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 $('.ss-month-days').innerHTML=short.map(n=>'<span aria-hidden="true">'+n+'</span>').join('')+'<span aria-hidden="true"></span>'.repeat(offset)+Array.from({length:total},(_,i)=>{const day=i+1,date=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');return '<button type="button" class="cursor-interaction" data-date="'+date+'" aria-pressed="'+(state.hasDate&&state.date===date)+'" aria-label="'+day+' '+esc($('.ss-month').textContent)+'">'+day+'</button>';}).join('');
 }
 if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:17,height:17}});
}
function restore(s){const v=s?.privateContent?.schedule;if(v&&Array.isArray(v.days)&&v.days.every(d=>Number.isInteger(d)&&d>=0&&d<7)&&v.times){Object.assign(state,v);state.days=[...new Set(state.days)].sort((a,b)=>a-b);state.days.forEach(d=>state.times[d]??={start:'19:00',end:'',hasEnd:false});}if(s?.modelContent?.design)Object.assign(design,s.modelContent.design);}
restore(window.openai?.widgetState);render();
root.addEventListener('click',e=>{const day=e.target.closest('[data-day]'),add=e.target.closest('[data-add]'),remove=e.target.closest('[data-remove]');if(day){const d=Number(day.dataset.day);state.days=state.days.includes(d)?state.days.filter(x=>x!==d):[...state.days,d].sort((a,b)=>a-b);state.times[d]??={start:'19:00',end:'',hasEnd:false};}else if(add)state.times[Number(add.dataset.add)].hasEnd=true;else if(remove)state.times[Number(remove.dataset.remove)].hasEnd=false;else return;clearFeedback();render();persist();});
root.addEventListener('input',e=>{const input=e.target;if(input.dataset.time){state.times[Number(input.dataset.index)][input.dataset.time]=input.value;clearFeedback();persist();}});
root.addEventListener('click',e=>{
 const date=e.target.closest('[data-date]');
 if(e.target.closest('.ss-pick-date')){pickerOpen=!pickerOpen;if(pickerOpen&&state.hasDate){const [y,m]=state.date.split('-').map(Number);pickerMonth=new Date(y,m-1,1);}}
 else if(e.target.closest('.ss-clear-date')){state.date='';state.hasDate=false;pickerOpen=false;clearFeedback();persist();}
 else if(date){state.date=date.dataset.date;state.hasDate=true;pickerOpen=false;clearFeedback();persist();}
 else if(e.target.closest('.ss-prev'))pickerMonth=new Date(pickerMonth.getFullYear(),pickerMonth.getMonth()-1,1);
 else if(e.target.closest('.ss-next'))pickerMonth=new Date(pickerMonth.getFullYear(),pickerMonth.getMonth()+1,1);
 else if(e.target.closest('.ss-picker-cancel'))pickerOpen=false;
 else return;render();
});
$('.ss-form').addEventListener('submit',e=>{e.preventDefault();clearFeedback();let error='';if(!state.days.length)error='Выберите хотя бы один день занятий.';else{for(const day of state.days){const t=state.times[day];if(!t.start){error=full[day]+': укажите время начала.';break;}if(t.hasEnd&&(!t.end||t.end<=t.start)){error=full[day]+': укажите окончание позже начала.';break;}}}if(!error&&state.hasDate&&!state.date)error='Выберите последний день занятий.';if(error){$('.ss-error').textContent=error;$('.ss-error').hidden=false;return;}persist();$('.ss-saved').textContent='Сохранено: '+state.days.map(d=>short[d]+' '+state.times[d].start+(state.times[d].hasEnd?'–'+state.times[d].end:'')).join(', ')+(state.hasDate?' · до '+state.date.split('-').reverse().join('.'):'');});
window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);render();});
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{render();persist();}});t.addSlider(design,'gap',{label:'Отступы между разделами',min:14,max:28,unit:'px'});}
})();
</script>
